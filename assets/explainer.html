<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<!-- Render with scripts/render_html.py; do not hand-edit generated evidence values. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ECEBE6; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; color: #1A1A1A; }
  .page { width: 210mm; background: #fff; margin: 16px auto; padding: 18mm 20mm 16mm;
          box-shadow: 0 2px 14px rgba(0,0,0,.08); }
  .kicker { font-size: 8.6pt; letter-spacing: 4px; color: #8A6A3B; }
  h1 { font-size: 19pt; margin: 7px 0 5px; line-height: 1.35; }
  .sub { font-size: 9pt; color: #6B6B73; line-height: 1.75; }
  .rule { height: 2px; background: #1F3B57; margin: 11px 0 4px; }
  h2 { font-size: 12pt; margin: 17px 0 6px; padding: 2px 0 2px 9px; border-left: 4px solid #1F3B57; line-height: 1.45; }
  h2 span { font-size: 8.4pt; color: #8A6A3B; font-weight: 400; letter-spacing: 1px; margin-left: 6px; }
  h3 { font-size: 10.2pt; margin: 10px 0 3px; color: #0F2A44; }
  p { font-size: 9.9pt; line-height: 1.86; margin-bottom: 6px; text-align: justify; }
  table { width: 100%; border-collapse: collapse; margin: 6px 0 8px; }
  th, td { border: 1px solid #CFD6DE; padding: 4px 6px; font-size: 8.7pt; line-height: 1.55;
           vertical-align: top; text-align: left; }
  th { background: #EEF2F7; font-weight: 700; font-size: 8.8pt; }
  .why { background: #F6F8FB; border-left: 3px solid #1F3B57; padding: 7px 11px; font-size: 9.3pt;
         line-height: 1.78; margin: 7px 0 9px; }
  .key { background: #FBF3E4; border-left: 3px solid #8A6A3B; padding: 7px 11px; font-size: 9.6pt;
         line-height: 1.8; margin: 8px 0; }
  .profile { border: 1px solid #DDE2E9; background: #FAFBFC; padding: 7px 10px; font-size: 8.5pt;
             line-height: 1.7; color: #4A5568; margin-bottom: 4px; }
  ol, ul { margin: 3px 0 7px 18px; }
  li { font-size: 9.7pt; line-height: 1.8; margin-bottom: 3px; text-align: justify; }
  .foot { margin-top: 16px; padding-top: 6px; border-top: 1px solid #DCDCD4; font-size: 8.2pt;
          color: #66665F; display: flex; justify-content: space-between; }
  @media print {
    body { background: #fff; }
    .page { margin: 0; box-shadow: none; width: auto; padding: 0; }
    @page { size: A4; margin: 16mm 17mm 14mm; }
    h2 { break-after: avoid; page-break-after: avoid; }
    table, .why, .key { break-inside: avoid; page-break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="kicker">{{KICKER}}</div>
  <h1>{{TITLE}}</h1>
  <div class="sub">{{SUBTITLE}}</div>
  {{PROFILE_BLOCK}}
  <div class="rule"></div>
  {{SECTIONS}}
  <div class="foot"><span>{{FOOTER}}</span><span>{{PAGE_LABEL}}</span></div>
</div>
</body>
</html>
