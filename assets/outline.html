<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<!-- Render with scripts/render_html.py; beat count is driven by content JSON. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ECEBE6; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; color: #1A1A1A; }
  .page { width: 210mm; background: #fff; margin: 16px auto; padding: 18mm 20mm 16mm;
          box-shadow: 0 2px 14px rgba(0,0,0,.08); }
  .kicker { font-size: 9pt; letter-spacing: 4px; color: #8A6A3B; }
  h1 { font-size: 20pt; margin: 7px 0 5px; line-height: 1.35; }
  .sub { font-size: 9.5pt; color: #6B6B73; line-height: 1.7; }
  .rule { height: 2px; background: #1F3B57; margin: 12px 0 6px; }
  h2 { font-size: 12pt; margin: 16px 0 6px; padding-left: 9px; border-left: 4px solid #1F3B57; line-height: 1.45; }
  .beat { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid #E4E8ED; }
  .beat .n { flex: 0 0 34px; font-size: 15pt; font-weight: 700; color: #74869B; }
  .beat .b { flex: 1; }
  .beat .t { font-size: 11pt; font-weight: 700; color: #0F2A44; line-height: 1.5; }
  .beat .d { font-size: 9.5pt; color: #354255; line-height: 1.7; margin-top: 2px; }
  .beat .h { font-size: 9pt; color: #76572E; line-height: 1.6; margin-top: 3px; }
  table { width: 100%; border-collapse: collapse; margin: 6px 0 8px; }
  th, td { border: 1px solid #CFD6DE; padding: 5px 7px; font-size: 8.8pt; line-height: 1.55;
           vertical-align: top; text-align: left; }
  th { background: #EEF2F7; font-weight: 700; font-size: 9pt; }
  .say { background: #FBF3E4; border-left: 3px solid #8A6A3B; padding: 8px 12px; font-size: 10pt;
         line-height: 1.85; margin: 10px 0; }
  li { font-size: 9pt; color: #45454B; line-height: 1.8; margin-bottom: 3px; }
  .foot { margin-top: 16px; padding-top: 7px; border-top: 1px solid #DCDCD4; font-size: 8.5pt;
          color: #66665F; display: flex; justify-content: space-between; }
  @media print {
    body { background: #fff; }
    .page { margin: 0; box-shadow: none; width: auto; padding: 0; }
    @page { size: A4; margin: 16mm 18mm 14mm; }
    .beat, tr { break-inside: avoid; page-break-inside: avoid; }
    h2 { break-after: avoid; page-break-after: avoid; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="kicker">{{KICKER}}</div>
  <h1>{{TITLE}}</h1>
  <div class="sub">{{SUBTITLE}}</div>
  <div class="rule"></div>
  {{BEATS}}
  {{MAPPING_BLOCK}}
  {{CLOSING_BLOCK}}
  {{NOTES_BLOCK}}
  <div class="foot"><span>{{FOOTER}}</span><span>{{PAGE_LABEL}}</span></div>
</div>
</body>
</html>
